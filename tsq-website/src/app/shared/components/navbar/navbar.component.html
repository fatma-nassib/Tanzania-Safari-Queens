<header class="navbar" [class.navbar--scrolled]="scrolled">
  <div class="navbar__inner">
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
      <img src="/assets/images/logo.jpg" alt="Tanzania Safari Queens" class="navbar__logo-img"/>
    </a>
    <nav class="navbar__links" aria-label="Main navigation">
      <a *ngFor="let l of links" [routerLink]="l.path" routerLinkActive="active"
         [routerLinkActiveOptions]="{exact:l.path==='/'}" class="navbar__link" (click)="closeMenu()">
        {{l.label}}
      </a>
    </nav>
    <div class="navbar__actions">
      <ng-container *ngIf="user$ | async as u; else guest">
        <a routerLink="/booking" class="btn btn--gold btn--sm">Book Now</a>
        <button class="btn btn--ghost btn--sm" (click)="logout()">Sign Out</button>
      </ng-container>
      <ng-template #guest>
        <a routerLink="/auth/login" class="btn btn--ghost btn--sm">Sign In</a>
        <a routerLink="/booking"   class="btn btn--gold btn--sm">Book Now</a>
      </ng-template>
    </div>
    <button class="navbar__burger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="navbar__drawer" [class.navbar__drawer--open]="menuOpen">
    <a *ngFor="let l of links" [routerLink]="l.path" class="navbar__drawer-link" (click)="closeMenu()">{{l.label}}</a>
    <a routerLink="/booking" class="btn btn--gold" style="margin-top:1rem" (click)="closeMenu()">Book Now</a>
  </div>
</header>
