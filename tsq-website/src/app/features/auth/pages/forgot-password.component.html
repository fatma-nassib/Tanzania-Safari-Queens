<div class="auth-page">
  <div class="auth-card">
    <img src="/assets/images/logo.jpg" alt="Tanzania Safari Queens" class="auth-card__logo"/>
    <h2>Reset Password</h2>
    <div *ngIf="sent" class="alert alert--success">Check your email for a password reset link.</div>
    <form *ngIf="!sent" [formGroup]="form" (ngSubmit)="submit()">
      <p class="auth-card__sub">Enter your email and we'll send a reset link.</p>
      <div class="alert alert--error" *ngIf="error">{{error}}</div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" formControlName="email" class="form-control" placeholder="you@email.com"/>
      </div>
      <button type="submit" class="btn btn--gold btn--full" [disabled]="submitting">Send Reset Link</button>
    </form>
    <p class="auth-card__switch"><a routerLink="/auth/login">← Back to Sign In</a></p>
  </div>
</div>
